<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mehmet Rasit Arisu</title>
  <meta name="description" content="Developer website for App Store listings and AdMob verification." />
  <style>
    :root {
      --bg: #071220;
      --mid: #0a1e32;
      --text: #e8f4fc;
      --muted: rgba(232, 244, 252, 0.62);
      --aqua: #6bafe8;
      --aqua-soft: #9ad4f5;
      --field: rgba(255, 255, 255, 0.06);
      --border: rgba(255, 255, 255, 0.10);
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(90, 170, 220, 0.22), transparent 55%),
        linear-gradient(160deg, var(--bg), var(--mid) 55%, #0c2842);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    main {
      width: min(480px, 100%);
      text-align: center;
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: linear-gradient(145deg, var(--aqua-soft), var(--aqua) 55%, #3a9bc9);
      box-shadow: 0 12px 32px rgba(92, 184, 232, 0.28);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    .lead {
      margin: 0 0 24px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 1.02rem;
    }
    form.card {
      text-align: left;
      padding: 22px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      gap: 14px;
    }
    label {
      display: grid;
      gap: 6px;
      font-size: 0.82rem;
      font-weight: 600;
      color: rgba(232, 244, 252, 0.72);
      letter-spacing: 0.02em;
    }
    input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--field);
      color: var(--text);
      font: inherit;
      font-size: 0.98rem;
      font-weight: 400;
      padding: 12px 14px;
      outline: none;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    input::placeholder, textarea::placeholder {
      color: rgba(232, 244, 252, 0.32);
    }
    input:focus, textarea:focus {
      border-color: rgba(107, 175, 232, 0.55);
      box-shadow: 0 0 0 3px rgba(107, 175, 232, 0.15);
    }
    textarea {
      min-height: 120px;
      resize: vertical;
    }
    button {
      margin-top: 4px;
      border: 0;
      border-radius: 999px;
      padding: 13px 18px;
      font: inherit;
      font-size: 1rem;
      font-weight: 650;
      color: #061018;
      cursor: pointer;
      background: linear-gradient(145deg, var(--aqua-soft), var(--aqua) 55%, #3a9bc9);
      box-shadow: 0 10px 24px rgba(92, 184, 232, 0.28);
      transition: transform 0.15s ease, filter 0.15s ease;
    }
    button:hover { filter: brightness(1.05); }
    button:active { transform: scale(0.98); }
    footer {
      margin-top: 28px;
      color: rgba(232, 244, 252, 0.38);
      font-size: 0.85rem;
    }
    a { color: var(--aqua); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Mehmet Rasit Arisu</h1>
    <p class="lead">Independent iOS developer. Send a message below.</p>

    <form
      class="card"
      action="https://formsubmit.co/mehmetrasitarisu@gmail.com"
      method="POST"
      onsubmit="document.getElementById('mail-subject').value = document.getElementById('subject').value"
    >
      <input type="hidden" name="_subject" id="mail-subject" value="Contact" />
      <input type="hidden" name="_captcha" value="false" />
      <input type="hidden" name="_template" value="table" />
      <input type="text" name="_honey" style="display:none" tabindex="-1" autocomplete="off" />

      <label>
        Email
        <input type="email" name="email" required placeholder="you@email.com" autocomplete="email" />
      </label>

      <label>
        Subject
        <input id="subject" type="text" name="subject" required placeholder="Subject" maxlength="120" />
      </label>

      <label>
        Message
        <textarea name="message" required placeholder="Write your message..."></textarea>
      </label>

      <button type="submit">Send</button>
    </form>

    <footer>
      Or email: <a href="mailto:mehmetrasitarisu@gmail.com">mehmetrasitarisu@gmail.com</a>
    </footer>
  </main>
</body>
</html>
