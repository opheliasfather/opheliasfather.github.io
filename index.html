<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Mehmet Rasit Arisu — Apps</title>
  <meta name="description" content="Developer site for Aquam and other apps by Mehmet Rasit Arisu." />
  <style>
    :root {
      --bg: #071220;
      --mid: #0a1e32;
      --text: #e8f4fc;
      --muted: rgba(232, 244, 252, 0.62);
      --aqua: #6bafe8;
      --aqua-soft: #9ad4f5;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: "SF Pro Display", "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(90, 170, 220, 0.22), transparent 55%),
        linear-gradient(160deg, var(--bg), var(--mid) 55%, #0c2842);
      display: grid;
      place-items: center;
      padding: 32px 20px;
    }
    main {
      width: min(520px, 100%);
      text-align: center;
    }
    .mark {
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      border-radius: 18px;
      background: linear-gradient(145deg, var(--aqua-soft), var(--aqua) 55%, #3a9bc9);
      box-shadow: 0 12px 32px rgba(92, 184, 232, 0.28);
    }
    h1 {
      margin: 0 0 8px;
      font-size: clamp(1.6rem, 4vw, 2rem);
      font-weight: 700;
      letter-spacing: -0.02em;
    }
    p {
      margin: 0 0 28px;
      color: var(--muted);
      line-height: 1.55;
      font-size: 1.02rem;
    }
    .card {
      text-align: left;
      padding: 18px 20px;
      border-radius: 16px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .card strong {
      display: block;
      margin-bottom: 4px;
      color: var(--aqua-soft);
      font-size: 1.05rem;
    }
    .card span {
      color: var(--muted);
      font-size: 0.94rem;
    }
    footer {
      margin-top: 28px;
      color: rgba(232, 244, 252, 0.38);
      font-size: 0.85rem;
    }
    a { color: var(--aqua); text-decoration: none; }
    a:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true"></div>
    <h1>Mehmet Rasit Arisu</h1>
    <p>Independent iOS developer. This site is the developer website for App Store listings and AdMob verification.</p>
    <div class="card">
      <strong>Aquam: Water Tracker &amp; Reminder</strong>
      <span>iOS hydration tracker with reminders and insights.</span>
    </div>
    <footer>
      Contact: <a href="mailto:mehmetrasitarisu@gmail.com">mehmetrasitarisu@gmail.com</a>
    </footer>
  </main>
</body>
</html>
